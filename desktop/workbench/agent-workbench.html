          delete session.textContinuation;
          save();
          renderTaskSummary();
          appendRunIndicator('正在处理任务');
          syncControls();
          recordEvent('task_started', { message: value }, Date.now(), session);
          renderProjects();
          var acceptedEvents = state.bufferedEvents.splice(0);
          acceptedEvents.forEach(handleEvent);
        } catch (error) {
          if (sendEpoch !== state.storageEpoch) return;
          state.pendingSend = false;
          // Rejected input does not close CCB. Retain the valid native session,
          // draft and attachments so retry cannot strand the one-process slot.
          state.starting = false;
          state.turnActive = false;
          state.bufferedEvents = [];
          removeRunIndicator();
          var message = safeText(error && error.message || error);
          ClaritideTaskRuns.update(session, 'error', { terminal: true }, Date.now());
          session.lastError = { code: state.nativeSessionId ? 'send_failed' : 'start_failed', message: message, time: Date.now() };
          session.lastFailedRequest = session.lastRequest;
          rememberDraft(true);
          save();
          appendErrorCard(message, false);
          recordEvent('error', { code: session.lastError.code, message: message, terminal: true }, Date.now());
          syncControls();
        }
      }

      async function stop() {
        if (browsingHistory()) return returnToRunningSession();
        if (!state.nativeSessionId || !state.turnActive) return;
        try {
          await bridge.stop({ sessionId: state.nativeSessionId });
          showToast('已发送停止请求');
        } catch (error) {
          showToast((english ? 'Failed to stop: ' : '停止失败：') + safeText(error && error.message || error));
        }
      }

      async function returnToWorkspace() {
        var epoch = state.storageEpoch;
        var saved = await rememberDraft(true);
        if (epoch !== state.storageEpoch) return;
        var hasUnsaved = state.accountScope && (state.storageUnsaved || state.draftsUnsavedLimit || (!state.storageReady && state.projects.length) || (saved === false && state.projects.length));
        if (hasUnsaved && !window.confirm(english ? 'Recent changes are not saved. Export your records before leaving, or leave anyway?' : '最近的修改尚未保存，建议先导出本账号记录。仍要离开吗？')) return;
        await closeNativeSession(true);
        if (epoch !== state.storageEpoch) return;
        window.location.assign(WORKSPACE_URL);
      }

      function handleEvent(event) {
        if (event.sessionId && event.sessionId !== state.nativeSessionId) return;
        if (state.runStorageEpoch !== state.storageEpoch) return;
        if ((state.starting || state.pendingSend) && event.sessionId) { state.bufferedEvents.push(event); return; }
        var payload = event.payload || {};
        var session = runningSession();
        if (!session) return;
        var visible = viewingRunningSession();
        var taskChanged = ClaritideTaskRuns.update(session, event.type, payload, event.timestampMs || Date.now());

        if (event.type === 'approval_requested') {
          state.pendingApprovals[payload.requestId] = payload;
          state.runningActivity = english ? 'Waiting for your approval' : '等待你的批准';
          if (visible) { renderApproval(payload); updateRunIndicator(state.runningActivity); }
        } else if (event.type === 'approval_resolved') {
          delete state.pendingApprovals[payload.requestId];
          if (visible) {
            var resolvedCard = document.getElementById('approval-' + safeText(payload.requestId));
            if (resolvedCard) resolvedCard.remove();
          }
        } else if (event.type === 'text_delta') {
          state.runningStream += safeText(payload.text);
          if (visible) {
            var last = $('#conversationInner .message.agent:last-of-type .message-body');
            if (!last || !last._streaming) last = appendMessage('agent', '', Date.now(), false);
            last._streaming = true;
            last._markdownSource = state.runningStream;
            last.classList.remove('formatted');
            last.textContent = state.runningStream;
          }
        } else if (event.type === 'assistant_final') {
          state.attemptingResume = false;
          var answerSource = typeof payload.text === 'string' ? payload.text : safeText(state.runningStream);
          if (visible) {
            var finalBody = $('#conversationInner .message.agent:last-of-type .message-body');
            if (!finalBody || !finalBody._streaming) finalBody = appendMessage('agent', '', Date.now(), false);
            renderAnswer(finalBody, answerSource);
          }
          state.runningStream = '';
          session.messages.push({ role: 'agent', text: answerSource, time: Date.now(), attachments: [] });
          session.updatedAt = Date.now();
          save();
          renderProjects();
        } else if (event.type === 'tool_started') {
          state.runningActivity = toolActivity(payload.tool || payload.toolName);
          if (visible) updateRunIndicator(state.runningActivity);
        } else if (event.type === 'turn_completed') {
          clearApprovalCards();
          state.turnActive = false;
          state.starting = false;
          if (visible) removeRunIndicator();
          session.lastResult = payload;
          session.lastError = null;
          session.lastFailedRequest = null;
          save();
          if (visible) appendResultCard(payload);
          renderProjects();
        } else if (event.type === 'error') {
          var approvalUnsupported = payload.code === 'tool_approval_unsupported';
          session.lastError = { code: payload.code, message: safeText(payload.message || payload.code), time: Date.now() };
          var protocolDiagnostics = safeProtocolDiagnostics(payload.diagnostics);
          if (protocolDiagnostics) session.lastError.diagnostics = protocolDiagnostics;
          if (payload.terminal === true || approvalUnsupported) session.lastFailedRequest = session.lastRequest || null;
          save();
          if (payload.code === 'interrupt_failed') showToast(payload.message || (english ? 'Failed to stop. Please retry.' : '停止失败，请重试。'));
          if (payload.terminal === true || approvalUnsupported) {
            state.turnActive = false;
            state.starting = false;
            if (visible) removeRunIndicator();
            if (payload.terminal === true) { state.closingSessionId = state.nativeSessionId; state.nativeSessionId = ''; }
            if (payload.terminal === true) clearApprovalCards();
            if (visible) appendErrorCard(payload.message || payload.code, approvalUnsupported);
            renderProjects();
          }
        } else if (event.type === 'stopped') {
          clearApprovalCards();
          state.turnActive = Boolean(payload.settling);
          if (!payload.settling) {
            state.nativeSessionId = '';
            if (visible) removeRunIndicator();
            renderProjects();
          }
        }

        if (event.type !== 'text_delta' && event.type !== 'assistant_final') {
          recordEvent(event.type, payload, event.timestampMs || Date.now(), session);
        }
        if (visible && taskChanged) renderTaskSummary();
        syncControls();
        if (visible) scrollConversation();
      }

      async function addFiles(files) {
        if (!state.storageReady || browsingHistory() || state.pendingSend) return;
        var ownerEpoch = state.storageEpoch;
        var ownerKey = composerKey();
        var total = state.attachments.reduce(function (sum, item) { return sum + item.size; }, 0);
        for (var index = 0; index < files.length; index += 1) {
          var file = files[index];
          if (state.attachments.length >= 100) { showToast(english ? 'Up to 100 text files per draft.' : '每份草稿最多添加 100 个文本文件。'); break; }
          if (file.size > FILE_LIMIT_BYTES) {
            showToast(tr('文件过大') + ': ' + file.name);
            continue;
          }
          if (total + file.size > TOTAL_FILE_LIMIT_BYTES) {
            showToast(english ? 'Files total cannot exceed 64 KB; the message must fit too.' : '附件合计不能超过 64 KB，正文也计入总大小。');
            break;
          }
          try {
            var content = await file.text();
            if (ownerEpoch !== state.storageEpoch || ownerKey !== composerKey() || state.turnActive || state.starting || state.pendingSend || browsingHistory()) break;
            if (content.indexOf('\u0000') >= 0) throw new Error('binary');
            var size = new TextEncoder().encode(content).length;
            if (size > FILE_LIMIT_BYTES || total + size > TOTAL_FILE_LIMIT_BYTES) { showToast(tr('文件过大') + ': ' + file.name); continue; }
            state.attachments.push({ name: file.name.slice(0, 512), content: content, size: size });
            total += size;
            showToast(tr('已添加文件') + ': ' + file.name);
          } catch (_error) {
            showToast(tr('仅支持文本文件') + ': ' + file.name);
          }
        }
        if (ownerEpoch !== state.storageEpoch) return;
        $('#fileInput').value = '';
        rememberDraft(true);
        renderAttachments();
        syncControls();
      }

      function toggleVoice() {
        if (!state.storageReady || browsingHistory() || state.pendingSend) return;
        if (!SpeechRecognition) return showToast('当前系统不支持语音输入');
        if (state.voiceActive && recognition) {
          recognition.stop();
          return;
        }
        var voiceOwnerKey = composerKey();
        var voiceOwnerEpoch = state.storageEpoch;
        recognition = new SpeechRecognition();
        recognition.lang = english ? 'en-US' : 'zh-CN';
        recognition.interimResults = false;
        recognition.continuous = true;
        recognition.onstart = function () { if (voiceOwnerEpoch !== state.storageEpoch) return; state.voiceActive = true; syncControls(); };
        recognition.onend = function () { if (voiceOwnerEpoch !== state.storageEpoch) return; state.voiceActive = false; syncControls(); };
        recognition.onerror = function () { if (voiceOwnerEpoch !== state.storageEpoch) return; state.voiceActive = false; syncControls(); showToast('语音识别失败'); };
        recognition.onresult = function (event) {
          if (voiceOwnerEpoch !== state.storageEpoch) return;
          if (voiceOwnerKey !== composerKey()) { if (recognition) recognition.stop(); return; }
          var text = '';
          for (var index = event.resultIndex; index < event.results.length; index += 1) {
            if (event.results[index].isFinal) text += event.results[index][0].transcript;
          }
          if (text) {
            var prompt = $('#prompt');
            prompt.value = (prompt.value ? prompt.value + ' ' : '') + text.trim();
            rememberDraft();
            autoSizePrompt();
            syncControls();
          }
        };
        try { recognition.start(); }
        catch (_error) { showToast('语音识别失败'); }
      }

      function autoSizePrompt() {
        var prompt = $('#prompt');
        prompt.style.height = 'auto';
        prompt.style.height = Math.min(prompt.scrollHeight, 160) + 'px';
      }

      function onSendClick() {
        if (state.turnActive) return stop();
        return send();
      }

      function onPromptKeydown(event) {
        if (event.isComposing || event.keyCode === 229) return;
        if (event.key === 'Enter' && !event.shiftKey) {
          event.preventDefault();
          if (state.turnActive || state.starting) {
            rememberDraft(true);
            showToast(english ? 'Draft kept. Send it after the current task finishes.' : '草稿已保留，当前任务结束后可手动发送。');
            return;
          }
          void send();
        }
      }

      function bind() {
        $('#toggleSidebar').addEventListener('click', function () { setSidebarOpen(!ui.sidebarOpen, true); });
        $('#closeSidebar').addEventListener('click', function () { setSidebarOpen(false, true); });
        $('#sidebarBackdrop').addEventListener('click', function () { setSidebarOpen(false, true); });
        $('#projectList').addEventListener('click', function (event) {
          if (ui.narrow && !state.starting && !state.pendingSend && event.target.closest('.project-row, .session-row')) setSidebarOpen(false, true);
        });
        $('#historySearch').addEventListener('input', renderProjects);
        $('#activityScope').addEventListener('change', function () {
          ui.activitySelection = { session: activeSession(), runId: this.value };
          renderActivity(); $('.activity-body').scrollTop = 0;
        });
        $('#returnRunningSession').addEventListener('click', returnToRunningSession);
        $('#continueViewedSession').addEventListener('click', function () { void continueViewedSession(); });
        $('#newProject').addEventListener('click', openProjectModal);
        $('#createProjectFromPopover').addEventListener('click', openProjectModal);
        $('#newSession').addEventListener('click', newConversation);
        $('#chooseFolder').addEventListener('click', chooseWorkspace);
        $('#createProject').addEventListener('click', createProject);
        $('#returnWorkspace').addEventListener('click', returnToWorkspace);
        $('#projectButton').addEventListener('click', function () { toggleControlPopover('project'); });
        $('#permissionButton').addEventListener('click', function () { toggleControlPopover('permission'); });
        $('#modelEffortButton').addEventListener('click', function () { toggleControlPopover('modelEffort'); });
        $$('[data-permission]').forEach(function (button) {
          button.addEventListener('click', function () { setPermission(button.getAttribute('data-permission')); });
        });
        $('#modelSelect').addEventListener('keydown', onModelKeydown);
        $('#effortRange').addEventListener('pointerdown', beginEffortGesture);
        $('#effortRange').addEventListener('keydown', beginEffortGesture);
        $('#effortRange').addEventListener('pointerup', endEffortGesture);
        $('#effortRange').addEventListener('pointercancel', endEffortGesture);
        $('#effortRange').addEventListener('keyup', endEffortGesture);
        $('#effortRange').addEventListener('blur', endEffortGesture);
        $('#effortRange').addEventListener('input', onEffortInput);
        $('#addContext').addEventListener('click', function () { $('#fileInput').click(); });
        $('#fileInput').addEventListener('change', function (event) { void addFiles(Array.prototype.slice.call(event.target.files || [])); });
        $('#voiceButton').addEventListener('click', toggleVoice);
        $('#send').addEventListener('click', onSendClick);
        $('#prompt').addEventListener('input', function () { rememberDraft(); autoSizePrompt(); syncControls(); });
        $('#prompt').addEventListener('keydown', onPromptKeydown);
        $('#conversation').addEventListener('scroll', onConversationScroll, { passive: true });
        $('#backToLatest').addEventListener('click', function () { scrollConversation(true); });
        window.addEventListener('pagehide', function () { rememberDraft(true); });
        $('#retryHistory').addEventListener('click', retryHistory);
        $('#exportHistory').addEventListener('click', function () { void exportAccountHistory(); });
        $('#showActivity').addEventListener('click', openActivity);
        $('#showDiagnostics').addEventListener('click', openDiagnostics);
        $('#copyDiagnostics').addEventListener('click', copyDiagnostics);
        $('#closeActivity').addEventListener('click', function () { $('#activityPanel').hidden = true; });
        $('#renameActiveSession').addEventListener('click', function () { var session = activeSession(); if (session) renameSession(session.id); $('#headerMenu').removeAttribute('open'); });
        $('#deleteActiveSession').addEventListener('click', function () { var session = activeSession(); if (session) void deleteSession(session.id); $('#headerMenu').removeAttribute('open'); });
        $('#cancelFullAccess').addEventListener('click', cancelFullAccess);
        $('#cancelFullAccessTop').addEventListener('click', cancelFullAccess);
        $('#confirmFullAccess').addEventListener('click', confirmFullAccess);
        $$('[data-close]').forEach(function (button) {
          button.addEventListener('click', function () { closeModal(button.getAttribute('data-close')); });
        });
        $$('.modal-backdrop').forEach(function (backdrop) {
          backdrop.addEventListener('click', function (event) {
            if (event.target !== backdrop) return;
            if (backdrop.id === 'fullAccessModal') cancelFullAccess();
            else closeModal(backdrop.id);
          });
        });
        document.addEventListener('click', function (event) {
          if (!event.target.closest('details')) closeMenus();
          if (!event.target.closest('.composer-control')) closeControlPopovers();
        });
        document.addEventListener('keydown', handleGlobalKeydown);
      }

      async function refreshRuntimeStatus() {
        if (!bridge || state.statusRefreshing) return;
        state.statusRefreshing = true;
        var request = ++state.statusRequestSequence;
        var epoch = state.storageEpoch;
        var status;
        try {
          status = await bridge.getStatus();
          if (request !== state.statusRequestSequence || epoch !== state.storageEpoch) return;
          state.status = status;
          await synchronizeAccount(status);
          if (request !== state.statusRequestSequence || state.status !== status || verifiedScope(status) !== state.accountScope) return;
          var expires = Number(state.status.authorizationExpiresAtMs || 0);
          var remaining = expires ? expires - Date.now() : 0;
          var expired = !state.status.available;
          var needsAuthorization = expired && /sign in|authoriz|expired|online ai/i.test(state.status.lastError || '');
          var expiring = expires && remaining < 120000;
          $('#runtimeStatus').textContent = expired ? (needsAuthorization ? (english ? 'AI authorization required' : 'AI 需要重新授权') : tr('Agent 不可用')) : expiring ? (english ? 'AI authorization expires soon' : 'AI 授权即将到期') : tr('Agent 已就绪');
          $('#runtimeStatus').title = safeText(state.status.lastError || (expires ? (english ? 'Authorization expires: ' : '授权到期：') + new Date(expires).toLocaleTimeString(locale) : ''));
          $('#runtimeDot').classList.toggle('ready', !expired);
          var renew = $('#renewAuthorization');
          if (!renew) {
            renew = document.createElement('button');
            renew.id = 'renewAuthorization'; renew.type = 'button'; renew.className = 'text-button';
            renew.textContent = english ? 'Renew access' : '重新授权';
            renew.addEventListener('click', returnToWorkspace);
            $('#runtimeStatus').parentNode.appendChild(renew);
          }
          renew.hidden = !needsAuthorization && !expiring;
          renew.disabled = state.turnActive || state.starting;
          renew.title = english ? 'Your conversation is saved. Return to My Day, reopen AI Workbench, and select this chat to continue.' : '对话已保存。返回我的今天，重新打开 AI 工作台后选择此对话即可继续。';
          fillModels(state.status.allowedModels || []);
        } catch (error) {
          if (request !== state.statusRequestSequence || epoch !== state.storageEpoch) return;
          state.status = { available: false };
          $('#runtimeStatus').textContent = tr('运行时检查失败');
          $('#runtimeStatus').title = safeText(error && error.message || error);
          $('#runtimeDot').classList.remove('ready');
        } finally {
          state.statusRefreshing = false;
          if (request === state.statusRequestSequence) syncControls();
        }
      }

      async function init() {
        applyTranslations();
        initLayout();
        bind();
        showLegacyHistoryNotice();
        updateHistoryNotice();
        renderProjects();
        renderConversation();
        renderAttachments();
        renderActivity();
        if (!bridge) {
          $('#runtimeStatus').textContent = tr('本地桥接不可用');
          syncControls();
          return;
        }
        bridge.onEvent(handleEvent);
        await refreshRuntimeStatus();
        window.setInterval(refreshRuntimeStatus, 15000);
        syncControls();
        // Confirm the document is usable only after its controls and native
        // status have initialized. Queuing a WebView navigation is not enough.
        try {
          await bridge.markReady();
        } catch (error) {
          $('#runtimeStatus').textContent = english ? 'Workbench opening failed' : '工作台打开失败';
          $('#runtimeStatus').title = safeText(error && error.message || error);
          showToast((english ? 'Unable to confirm workbench startup: ' : '工作台启动确认失败：') + safeText(error && error.message || error));
        }
      }

      void init();
    })();
  </script>
</body>
</html>
