<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src ipc: http://ipc.localhost https://ipc.localhost;">
  <title>Claritide · AI 工作台</title>
  <style>
    :root {
      font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      color: #222320;
      background: #fff;
      --ink: #222320;
      --muted: #696b66;
      --dim: #969892;
      --line: #e7e8e4;
      --line-strong: #d8dad4;
      --sidebar: #f3f3f0;
      --soft: #f7f7f5;
      --active: #e8e8e4;
      --surface: #fff;
      --mint: #0b8f84;
      --mint-dark: #08756d;
      --mint-soft: #e7f6f3;
      --red: #b5444d;
      --red-soft: #fff2f2;
      --amber: #805b19;
      --amber-soft: #fff7e6;
      --shadow: 0 14px 38px rgba(29, 31, 27, .13);
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; min-width: 320px; height: 100%; margin: 0; }
    body { overflow: hidden; background: var(--surface); color: var(--ink); font-size: 14px; }
    button, input, select, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, summary:focus-visible {
      outline: 3px solid rgba(11, 143, 132, .18);
      outline-offset: 2px;
    }
    [hidden] { display: none !important; }

    .app { height: 100vh; display: grid; grid-template-columns: 276px minmax(0, 1fr); }
    .sidebar {
      min-height: 0;
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr) auto;
      border-right: 1px solid var(--line);
      background: var(--sidebar);
    }
    .sidebar-head { height: 56px; display: flex; align-items: center; gap: 9px; padding: 0 14px; }
    .brand-mark {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      background: var(--mint);
      color: #fff;
      font-weight: 800;
    }
    .brand-name { font-size: 14px; font-weight: 750; }
    .spacer { flex: 1; }
    .text-button {
      min-height: 32px;
      padding: 0 10px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      font-size: 12px;
    }
    .text-button:hover { background: var(--active); color: var(--ink); }
    .new-chat {
      height: 40px;
      margin: 3px 10px 13px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      border: 0;
      border-radius: 9px;
      background: transparent;
      font-weight: 650;
      text-align: left;
    }
    .new-chat:hover { background: var(--active); }
    .shortcut { color: var(--dim); font-size: 11px; font-weight: 500; }
    .sidebar-scroll { min-height: 0; overflow: auto; padding: 0 8px 18px; }
    .section-head { height: 34px; display: flex; align-items: center; padding: 0 7px; color: var(--muted); font-size: 11px; font-weight: 650; }
    .section-head button { margin-left: auto; }
    .compact-action {
      min-width: 28px;
      height: 28px;
      padding: 0 7px;
      display: inline-grid;
      place-items: center;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: var(--muted);
      font-size: 12px;
    }
    .compact-action:hover { background: var(--active); color: var(--ink); }
    .empty-projects { margin: 6px 5px; padding: 14px; color: var(--muted); font-size: 12px; line-height: 1.6; }
    .history-search { width: calc(100% - 14px); margin: 0 7px 9px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); font-size: 12px; }
    .history-empty { padding: 12px; color: var(--muted); font-size: 12px; }
    .history-notice { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin: 0 0 8px; color: var(--muted); font-size: 12px; }
    .history-notice[hidden] { display: none; }
    .history-notice span { flex: 1 1 180px; }
    .session-row.is-running .session-title::before { content: '● '; color: #437456; }
    .project { margin-bottom: 4px; }
    .item-shell.project-shell { grid-template-columns: 30px minmax(0, 1fr) 30px; }
    .project-toggle { width: 28px; height: 32px; margin-left: 2px; }
    .project-toggle .icon { transition: transform .15s; }
    .project-toggle[aria-expanded="true"] .icon { transform: rotate(90deg); }
    .item-shell {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 30px;
      align-items: center;
      border-radius: 8px;
    }
    .item-shell:hover, .item-shell.active { background: var(--active); }
    .project-row, .session-row { width: 100%; min-width: 0; border: 0; background: transparent; text-align: left; }
    .project-row { height: 38px; padding: 0 7px; font-weight: 650; }
    .session-row { min-height: 34px; padding: 6px 7px 6px 25px; color: #454743; font-size: 12px; }
    .project-name, .session-title { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .session-list { padding: 1px 0 4px; }
    .session-shell.active { background: #dcdcd7; }
    .item-menu { position: relative; height: 28px; }
    .item-menu summary {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      border-radius: 7px;
      color: var(--muted);
      cursor: pointer;
      list-style: none;
      opacity: 0;
      font-size: 11px;
    }
    .item-shell:hover .item-menu summary, .item-menu[open] summary { opacity: 1; }
    .item-menu summary::-webkit-details-marker, .header-menu summary::-webkit-details-marker { display: none; }
    .menu-popover {
      position: absolute;
      right: 0;
      top: 30px;
      z-index: 30;
      width: 138px;
      padding: 5px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      box-shadow: var(--shadow);
    }
    .menu-popover button { width: 100%; height: 33px; padding: 0 9px; border: 0; border-radius: 7px; background: transparent; text-align: left; font-size: 12px; }
    .menu-popover button:hover { background: var(--soft); }
    .menu-popover .danger { color: var(--red); }
    .storage-notice { margin: 8px 5px; padding: 10px; border: 1px solid var(--line); border-radius: 8px; font-size: 11px; line-height: 1.6; color: var(--muted); }
    .storage-notice.warning { background: var(--amber-soft); color: var(--amber); }
    .storage-notice button { margin-top: 5px; }
    .sidebar-foot { min-height: 48px; display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-top: 1px solid var(--line); color: var(--muted); font-size: 11px; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); }
    .status-dot.ready { background: var(--mint); }

    .main { min-width: 0; min-height: 0; position: relative; display: grid; grid-template-rows: 56px minmax(0, 1fr); background: #fff; }
    .main-head { display: flex; align-items: center; gap: 10px; padding: 0 18px; border-bottom: 1px solid var(--line); }
    .conversation-title { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; font-weight: 700; }
    .conversation-path { min-width: 0; max-width: 42%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--dim); font-size: 11px; }
    .header-menu { position: relative; }
    .header-menu summary { min-width: 34px; height: 32px; display: grid; place-items: center; border-radius: 8px; color: var(--muted); cursor: pointer; list-style: none; }
    .header-menu summary:hover, .header-menu[open] summary { background: var(--soft); color: var(--ink); }
    .header-menu .menu-popover { top: 36px; }
    .conversation { min-height: 0; overflow: auto; padding: 28px 0 170px; scroll-behavior: smooth; }
    .conversation-inner { width: min(820px, calc(100% - 56px)); margin: 0 auto; }
    .welcome { min-height: 330px; display: grid; place-items: center; text-align: center; }
    .welcome h1 { margin: 0 0 9px; color: var(--ink); font-size: 21px; font-weight: 720; }
    .welcome p { max-width: 500px; margin: 0; color: var(--muted); line-height: 1.7; }
    .message { padding: 16px 0; }
    .message.user { display: flex; justify-content: flex-end; }
    .user-message-wrap { min-width: 0; max-width: min(560px, 82%); }
    .user-bubble { width: fit-content; max-width: 100%; margin-left: auto; padding: 10px 14px; border-radius: 16px; background: var(--soft); color: #30322f; line-height: 1.65; white-space: pre-wrap; overflow-wrap: anywhere; }
    .message.agent { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 12px; }
    .agent-mark { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 8px; background: var(--mint); color: #fff; font-size: 10px; font-weight: 800; }
    .message-head { display: flex; align-items: center; gap: 8px; margin: 2px 0 7px; }
    .message-head strong { font-size: 12px; }
    .message-head span { color: var(--dim); font-size: 10px; }
    .message-body { white-space: pre-wrap; overflow-wrap: anywhere; color: #30322f; line-height: 1.72; }
    .message-attachments { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 5px; margin-bottom: 6px; }
    .attachment-label { padding: 4px 8px; border: 1px solid var(--line); border-radius: 999px; background: #fff; color: var(--muted); font-size: 10px; }
    .run-indicator { margin: 12px 0 16px 42px; display: flex; align-items: center; gap: 9px; color: var(--muted); font-size: 12px; }
    .run-indicator button { border: 0; background: transparent; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; }
    .pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--mint); box-shadow: 0 0 0 4px var(--mint-soft); animation: breathe 1.5s ease-in-out infinite; }
    @keyframes breathe { 50% { opacity: .42; transform: scale(.78); } }
    .result-card, .error-card, .approval-card { margin: 12px 0 16px 42px; padding: 13px 14px; border: 1px solid var(--line); border-radius: 12px; background: #fff; }
    .result-card { background: #fbfcfb; }
    .error-card { border-color: #efd1d4; background: var(--red-soft); }
    .approval-card { border-color: #ead8aa; background: var(--amber-soft); }
    .card-title { margin: 0 0 5px; font-size: 12px; font-weight: 700; }
    .card-copy { margin: 0; color: var(--muted); font-size: 11px; line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere; }
    .card-actions { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 10px; }
    .card-button { min-height: 31px; padding: 0 10px; border: 1px solid var(--line-strong); border-radius: 8px; background: #fff; color: var(--ink); font-size: 11px; }
    .card-button:hover { background: var(--soft); }
    .message-body.formatted { white-space: normal; }
    .message-body.formatted > :first-child { margin-top: 0; }
    .message-body.formatted > :last-child { margin-bottom: 0; }
    .message-body.formatted p { margin: 10px 0; white-space: pre-wrap; }
    .message-body.formatted h1, .message-body.formatted h2, .message-body.formatted h3 { margin: 21px 0 9px; line-height: 1.4; font-size: 17px; }
    .message-body.formatted h1 { font-size: 20px; }
    .message-body.formatted h3 { font-size: 15px; }
    .message-body.formatted ul, .message-body.formatted ol { margin: 10px 0; padding-left: 24px; }
    .message-body.formatted li { margin: 4px 0; }
    .message-body.formatted blockquote { margin: 12px 0; padding: 2px 14px; border-left: 3px solid var(--line-strong); color: var(--muted); white-space: pre-wrap; }
    .message-body.formatted code { padding: 2px 5px; border-radius: 4px; background: var(--soft); font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: .9em; }
    .markdown-code { min-width: 0; margin: 13px 0; overflow: hidden; border: 1px solid var(--line); border-radius: 9px; }
    .markdown-code-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 6px 10px; background: var(--soft); color: var(--muted); font-size: 11px; }
    .markdown-code pre { max-height: 460px; overflow: auto; margin: 0; padding: 13px; line-height: 1.6; white-space: pre; }
    .message-body.formatted .markdown-code code { padding: 0; background: transparent; }
    .markdown-code .card-button { min-height: 28px; }
    .markdown-link { display: inline; padding: 0; border: 0; background: transparent; color: var(--mint-dark); text-align: left; text-decoration: underline; text-underline-offset: 3px; overflow-wrap: anywhere; font: inherit; }
    .markdown-link small { margin-left: 4px; color: var(--muted); font-size: 10px; text-decoration: none; }
    .markdown-table-wrap { max-width: 100%; margin: 13px 0; overflow-x: auto; }
    .markdown-table-wrap table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .markdown-table-wrap th, .markdown-table-wrap td { padding: 8px 10px; border: 1px solid var(--line); text-align: left; vertical-align: top; min-width: 90px; }
    .markdown-table-wrap th { background: var(--soft); font-weight: 650; }
    .approval-operation { margin: 9px 0; padding: 10px; max-height: 180px; overflow: auto; border: 1px solid var(--line); border-radius: 7px; background: #fff; font-size: 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
    .approval-details { margin: 10px 0; color: var(--muted); font-size: 11px; }
    .approval-details summary { cursor: pointer; }
    .approval-details pre { max-height: 260px; overflow: auto; padding: 10px; border: 1px solid var(--line); border-radius: 7px; background: #fff; white-space: pre-wrap; overflow-wrap: anywhere; }

    .composer-wrap { position: absolute; left: 0; right: 0; bottom: 0; padding: 20px 24px 22px; background: linear-gradient(180deg, rgba(255,255,255,0), #fff 28px); }
    .composer { width: min(820px, calc(100% - 8px)); margin: 0 auto; border: 1px solid #dadcd6; border-radius: 19px; background: #fff; box-shadow: 0 7px 24px rgba(30, 32, 29, .09); }
    .composer:focus-within { border-color: #c7c9c3; box-shadow: 0 9px 28px rgba(30, 32, 29, .12); }
    .composer textarea { width: 100%; min-height: 66px; max-height: 160px; resize: none; padding: 16px 16px 6px; border: 0; outline: 0; background: transparent; line-height: 1.55; }
    .attachment-tray { display: flex; flex-wrap: wrap; gap: 6px; padding: 1px 12px 7px; }
    .attachment-chip { display: inline-flex; align-items: center; gap: 6px; max-width: 220px; min-height: 28px; padding: 0 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--soft); color: var(--muted); font-size: 10px; }
    .attachment-chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .attachment-chip button { padding: 0; border: 0; background: transparent; color: var(--dim); font-size: 10px; }
    .composer-row { min-height: 46px; display: flex; align-items: center; gap: 6px; padding: 5px 8px 8px; }
    .composer-control { position: relative; }
    .composer-button { height: 32px; padding: 0 10px; border: 0; border-radius: 9px; background: transparent; color: #5f615c; font-size: 11px; white-space: nowrap; }
    .composer-button:hover, .composer-button[aria-expanded="true"] { background: var(--soft); color: var(--ink); }
    .composer-button:disabled { cursor: not-allowed; opacity: .42; }
    .project-button { max-width: 185px; overflow: hidden; text-overflow: ellipsis; }
    .model-effort-button { max-width: 210px; background: var(--soft); color: var(--ink); }
    .voice-button.listening { background: var(--mint-soft); color: var(--mint-dark); }
    .send-button { min-width: 58px; height: 34px; padding: 0 13px; border: 0; border-radius: 10px; background: #1b1c1a; color: #fff; font-size: 11px; font-weight: 700; }
    .send-button.stop-state { background: var(--red); }
    .send-button:disabled { cursor: not-allowed; opacity: .26; }
    .control-popover {
      position: absolute;
      left: 0;
      bottom: 40px;
      z-index: 40;
      width: 290px;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: #fff;
      box-shadow: var(--shadow);
    }
    .control-popover.align-right { right: 0; left: auto; width: 324px; padding: 12px; }
    .popover-title { padding: 3px 6px 7px; color: var(--dim); font-size: 10px; font-weight: 700; }
    .popover-list { display: grid; gap: 2px; }
    .popover-option { width: 100%; min-height: 40px; padding: 7px 9px; border: 0; border-radius: 9px; background: transparent; text-align: left; }
    .popover-option:hover, .popover-option.selected { background: var(--soft); }
    .option-title { display: flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 650; }
    .option-title .check { margin-left: auto; color: var(--mint-dark); }
    .option-copy { margin-top: 3px; color: var(--dim); font-size: 10px; line-height: 1.45; }
    .popover-divider { height: 1px; margin: 7px 3px; background: var(--line); }
    .model-field label, .model-field > p, .effort-field legend { display: block; margin: 0 0 7px; color: var(--muted); font-size: 11px; font-weight: 650; }
    .model-options { display: grid; gap: 3px; max-height: min(260px, 35vh); overflow-y: auto; }
    .model-option { display: flex; align-items: center; gap: 8px; min-height: 40px; width: 100%; padding: 9px 10px; border: 0; border-radius: 8px; background: transparent; text-align: left; overflow-wrap: anywhere; font-size: 12px; }
    .model-option:hover, .model-option[aria-selected="true"] { background: var(--soft); }
    .model-option[aria-selected="true"]::after { content: '✓'; margin-left: auto; flex-shrink: 0; }
    .model-option:disabled { cursor: default; color: var(--dim); }
    .task-summary { margin: 14px 0; padding: 13px 14px; border: 1px solid var(--line); border-radius: 11px; font-size: 12px; }
    .task-summary-head { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
    .task-summary-head strong { font-size: 12px; }
    .task-summary-head span, .task-note { color: var(--muted); font-size: 11px; line-height: 1.6; }
    .task-goal { margin: 8px 0; color: var(--muted); white-space: pre-wrap; overflow-wrap: anywhere; }
    .task-plan { max-height: 240px; overflow-y: auto; margin: 9px 0; padding: 0; list-style: none; }
    .task-plan li { display: flex; align-items: baseline; gap: 8px; margin: 7px 0; line-height: 1.6; overflow-wrap: anywhere; }
    .task-plan li span:first-child { color: var(--muted); flex-shrink: 0; }
    .task-records { margin-top: 9px; }
    .task-records > summary { cursor: pointer; color: var(--muted); padding: 3px 0; }
    .task-operation { padding: 9px 0; border-bottom: 1px solid var(--line); }
    .task-operation:last-child { border: 0; }
    .task-operation p { margin: 4px 0; color: var(--muted); white-space: pre-wrap; overflow-wrap: anywhere; font-size: 11px; line-height: 1.6; }
    .task-operation code { display: block; overflow-wrap: anywhere; white-space: pre-wrap; font-size: 11px; line-height: 1.6; }
    .activity .task-summary { margin: 10px; }
    .effort-field { margin: 14px 0 0; padding: 0; border: 0; }
    .effort-field legend { display: flex; justify-content: space-between; gap: 12px; width: 100%; }
    .effort-value { color: var(--mint-dark); font-weight: 700; text-align: right; }
    .effort-field input[type="range"] { width: 100%; accent-color: var(--mint); }
    .effort-scale { display: flex; justify-content: space-between; color: var(--dim); font-size: 9px; }
    .popover-note { margin: 9px 2px 1px; color: var(--dim); font-size: 10px; line-height: 1.5; }

    .activity { position: absolute; top: 56px; right: 0; bottom: 0; z-index: 25; width: 360px; display: grid; grid-template-rows: 50px minmax(0, 1fr); border-left: 1px solid var(--line); background: #fff; box-shadow: -12px 0 30px rgba(30, 32, 29, .08); }
    .activity-head { display: flex; align-items: center; gap: 7px; padding: 0 13px; border-bottom: 1px solid var(--line); }
    .activity-head small { color: var(--dim); }
    .activity-head button { margin-left: auto; }
    .activity-body { min-height: 0; overflow: auto; }
    .activity-scope { width: calc(100% - 26px); margin: 12px 13px; padding: 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); font-size: 12px; }
    .activity-empty { padding: 28px 18px; color: var(--muted); font-size: 12px; line-height: 1.65; }
    .log-item { padding: 11px 13px; border-bottom: 1px solid var(--line); }
    .log-item strong { display: block; margin-bottom: 4px; font-size: 11px; }
    .log-item p { margin: 0; color: var(--muted); font-size: 10px; line-height: 1.55; overflow-wrap: anywhere; }
    .log-time { float: right; color: var(--dim); font-weight: 400; }

    .modal-backdrop { position: fixed; inset: 0; z-index: 60; display: none; place-items: center; padding: 22px; background: rgba(24, 27, 23, .32); }
    .modal-backdrop.open { display: grid; }
    .modal { width: min(470px, 100%); max-height: calc(100vh - 44px); overflow: auto; border: 1px solid var(--line); border-radius: 14px; background: #fff; box-shadow: var(--shadow); }
    .modal header { display: flex; align-items: center; justify-content: space-between; padding: 15px 17px; border-bottom: 1px solid var(--line); }
    .modal h2 { margin: 0; font-size: 16px; }
    .modal-body { padding: 16px 17px; }
    .modal-copy { margin: 0 0 13px; color: var(--muted); font-size: 12px; line-height: 1.65; }
    .form-field { margin-bottom: 13px; }
    .form-field label { display: block; margin-bottom: 5px; color: var(--muted); font-size: 11px; font-weight: 650; }
    .form-field input { width: 100%; height: 40px; padding: 0 10px; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
    .warning { padding: 12px; border: 1px solid #ecd3a4; border-radius: 9px; background: var(--amber-soft); color: #75561e; font-size: 11px; line-height: 1.65; }
    .modal footer { display: flex; justify-content: flex-end; gap: 8px; padding: 11px 17px 15px; }
    .btn { min-height: 36px; padding: 0 12px; border-radius: 8px; font-weight: 650; }
    .btn.primary { border: 1px solid var(--mint); background: var(--mint); color: #fff; }
    .btn.secondary { border: 1px solid var(--line); background: #fff; }
    .btn.danger { border: 1px solid #e7b3b8; background: #fff; color: var(--red); }
    .btn:disabled { cursor: not-allowed; opacity: .45; }
    .toast { position: fixed; left: 50%; bottom: 24px; z-index: 80; padding: 9px 13px; border: 1px solid var(--line); border-radius: 9px; background: #fff; box-shadow: var(--shadow); font-size: 11px; font-weight: 650; transform: translate(-50%, 16px); opacity: 0; pointer-events: none; transition: 150ms; }
    .toast.visible { transform: translate(-50%, 0); opacity: 1; }

    @media (max-width: 1050px) {
      .app { grid-template-columns: 238px minmax(0, 1fr); }
      .conversation-inner { width: calc(100% - 40px); }
      .conversation-path { display: none; }
      .project-button { max-width: 125px; }
      .composer-button { padding: 0 8px; }
    }

    /* Keep the CCB runtime powerful while making the everyday surface feel as
       direct and quiet as a dedicated AI tool. */
    :root {
      --ink: #20211f;
      --muted: #676963;
      --dim: #9b9d97;
      --line: #e9e9e5;
      --line-strong: #d9dad5;
      --sidebar: #f4f4f1;
      --soft: #f5f5f2;
      --active: #e8e8e4;
      --mint: #20211f;
      --mint-dark: #20211f;
      --mint-soft: #eeeeea;
      --shadow: 0 14px 42px rgba(24, 25, 23, .12);
    }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, summary:focus-visible {
      outline-color: rgba(32, 33, 31, .18);
    }
    .app { grid-template-columns: 234px minmax(0, 1fr); }
    .sidebar { background: var(--sidebar); }
    .sidebar-head { height: 52px; padding: 0 12px 0 15px; }
    .brand-mark { display: none; }
    .brand-name { font-size: 15px; font-weight: 700; letter-spacing: -.01em; }
    .text-button { min-height: 30px; padding: 0 8px; }
    .new-chat {
      height: 40px;
      margin: 1px 7px 15px;
      padding: 0 10px;
      border-radius: 7px;
      font-weight: 600;
      justify-content: flex-start;
      gap: 8px;
    }
    .new-chat .shortcut { margin-left: auto; opacity: .72; }
    .sidebar-scroll { padding: 0 6px 18px; }
    .section-head { height: 31px; padding: 0 9px; font-size: 10px; font-weight: 600; }
    .compact-action { min-width: 27px; height: 27px; font-size: 11px; }
    .project { margin-bottom: 2px; }
    .item-shell { border-radius: 6px; }
    .project-row { height: 32px; padding: 0 9px; display: flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 600; }
    .project-row .icon { width: 14px; height: 14px; color: #767871; }
    .session-row { min-height: 29px; padding: 4px 7px 4px 23px; font-size: 12px; }
    .session-shell.active { background: #e2e2de; }
    .sidebar-foot { min-height: 43px; padding: 7px 14px; border-top-color: transparent; }
    .status-dot { width: 7px; height: 7px; }
    .status-dot.ready { background: #3f9b65; }

    .main { grid-template-rows: 44px minmax(0, 1fr); }
    .main-head { padding: 0 16px; border-bottom-color: transparent; }
    .conversation-title { font-size: 13px; font-weight: 650; }
    .conversation-path { display: none; }
    .header-menu summary { min-width: 32px; height: 30px; }
    .conversation { padding: 38px 0 170px; }
    .conversation-inner { width: min(640px, calc(100% - 48px)); }
    .welcome { min-height: 300px; }
    .welcome h1 { font-size: 22px; letter-spacing: -.02em; }
    .welcome p { max-width: 460px; font-size: 13px; }
    .message { padding: 12px 0; }
    .user-bubble {
      max-width: 100%;
      padding: 9px 13px;
      border-radius: 15px;
      background: #f3f3f0;
    }
    .message.agent { display: block; }
    .agent-mark, .message.agent .message-head { display: none; }
    .message-body { color: #292a27; line-height: 1.62; }
    .run-indicator { margin: 9px 0 13px; }
    .pulse { width: 7px; height: 7px; background: #696b65; box-shadow: 0 0 0 4px #efefeb; }
    .result-card, .error-card, .approval-card {
      margin: 11px 0 15px;
      padding: 12px 13px;
      border-radius: 10px;
    }
    .result-card {
      width: fit-content;
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 0;
      border: 0;
      background: transparent;
    }
    .result-card .card-title { margin: 0; color: var(--muted); font-size: 11px; font-weight: 600; }
    .result-card .card-copy { margin: 0; color: var(--muted); font-size: 11px; }
    .result-card .card-actions { margin: 0; }
    .result-card .card-button {
      min-height: auto;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--muted);
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .composer-wrap { padding: 14px 24px 8px; background: linear-gradient(180deg, rgba(255,255,255,0), #fff 28px); }
    .composer {
      width: min(640px, calc(100% - 8px));
      border-color: #dedfda;
      border-radius: 18px;
      box-shadow: 0 5px 18px rgba(29, 30, 28, .08);
    }
    .composer:focus-within { border-color: #cfd0cb; box-shadow: 0 8px 24px rgba(29, 30, 28, .1); }
    .composer textarea { min-height: 88px; padding: 15px 15px 5px; }
    .composer-row { min-height: 44px; padding: 4px 7px 7px; }
    .composer-button { height: 31px; padding: 0 8px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; border-radius: 8px; color: #666862; }
    .project-control { display: none; }
    .model-effort-button { max-width: 210px; background: transparent; color: #31322f; }
    .model-effort-button:hover, .model-effort-button[aria-expanded="true"] { background: var(--soft); }
    .voice-button.listening { background: #ecece8; color: #20211f; }
    .send-button { width: 32px; min-width: 32px; height: 32px; padding: 0; display: inline-grid; place-items: center; border-radius: 50%; background: #1f201e; }
    .icon { width: 15px; height: 15px; flex: 0 0 auto; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    .send-button .icon { width: 16px; height: 16px; }
    .send-button .stop-icon { display: none; }
    .send-button.stop-state .send-icon { display: none; }
    .send-button.stop-state .stop-icon { display: block; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    .control-popover { border-radius: 12px; }
    .popover-option { border-radius: 8px; }
    .option-title .check, .effort-value { color: #20211f; }
    .effort-field input[type="range"] { accent-color: #20211f; }

    .activity { top: 44px; width: 340px; }
    .modal { border-radius: 13px; }
    .btn.primary { border-color: #20211f; background: #20211f; }

    @media (max-width: 1050px) {
      .app { grid-template-columns: 218px minmax(0, 1fr); }
      .conversation-inner { width: calc(100% - 40px); max-width: 640px; }
      .composer { max-width: 640px; }
    }

    /* Keep the composer in layout so multiline drafts never cover a reply. */
    .app { height: 100dvh; }
    .main { grid-column: 2; grid-template-rows: 44px minmax(0, 1fr) auto; }
    .composer-wrap { position: static; min-width: 0; background: #fff; }
    .conversation { padding-bottom: 24px; }
    .conversation-path { display: block; color: var(--muted); }
    .sidebar-toggle { flex: 0 0 auto; }
    .sidebar-close { display: none; }
    .app.sidebar-collapsed { grid-template-columns: 0 minmax(0, 1fr); }
    .app.sidebar-collapsed .sidebar { display: none; }
    .sidebar-backdrop { position: fixed; inset: 0; z-index: 35; border: 0; background: rgba(24, 27, 23, .25); }
    .welcome .btn { margin-top: 20px; font-size: 13px; }
    .item-shell:focus-within .item-menu summary { opacity: 1; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, summary:focus-visible { outline-color: rgba(32, 33, 31, .55); }
    .composer textarea:focus-visible { outline-offset: -5px; border-radius: 15px; }
    @media (max-width: 880px) {
      .app, .app.sidebar-collapsed { grid-template-columns: minmax(0, 1fr); }
      .main { grid-column: 1; }
      .sidebar { position: fixed; inset: 0 auto 0 0; z-index: 40; width: min(280px, 85vw); box-shadow: var(--shadow); }
      .sidebar-close { display: inline-flex; }
      .main-head { padding: 0 10px; gap: 7px; }
      .composer-wrap { padding: 10px 12px 8px; }
      .conversation-inner { width: calc(100% - 32px); }
      .composer { width: 100%; }
      .activity { width: min(340px, 100%); }
    }
    @media (max-width: 560px) {
      .conversation-path { max-width: 35%; }
      .composer-row { flex-wrap: wrap; }
      .model-effort-button { max-width: 165px; }
      .control-popover, .control-popover.align-right { position: fixed; left: 12px; right: 12px; bottom: 90px; width: auto; max-height: 55vh; overflow: auto; }
      .welcome { min-height: 230px; }
      .welcome h1 { font-size: 20px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .conversation { scroll-behavior: auto; }
      .pulse { animation: none; }
      .toast { transition: none; }
    }
    .back-to-latest { display: block; margin: 0 auto 8px; padding: 7px 13px; border: 1px solid var(--line, #e5e7eb); border-radius: 18px; background: #fff; color: #374151; box-shadow: 0 2px 10px #0000000d; cursor: pointer; }
    .back-to-latest[hidden] { display: none; }
  </style>
</head>
<body>
  <!-- Interface icons are from Lucide (ISC License). -->
  <div class="app">
    <aside class="sidebar" id="workspaceSidebar" aria-label="项目与对话" data-i18n-aria="项目与对话">
      <header class="sidebar-head">
        <div class="brand-mark" aria-hidden="true">C</div>
        <div class="brand-name">Claritide</div>
        <span class="spacer"></span>
        <button class="text-button sidebar-close" id="closeSidebar" type="button" aria-label="关闭项目栏" data-i18n-aria="关闭项目栏">×</button>
        <button class="text-button" id="returnWorkspace" type="button">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 19-7-7 7-7"></path><path d="M19 12H5"></path></svg>
          <span data-i18n="返回">返回</span>
        </button>
      </header>
      <button class="new-chat" id="newSession" type="button">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.375 2.625a1 1 0 0 1 3 3l-9.013 9.014a2 2 0 0 1-.853.505l-2.873.84a.5.5 0 0 1-.62-.62l.84-2.873a2 2 0 0 1 .506-.852z"></path></svg>
        <span data-i18n="新对话">新对话</span>
        <span class="shortcut" id="newChatShortcut">Ctrl N</span>
      </button>
      <div class="sidebar-scroll">
        <div class="section-head">
          <span data-i18n="项目">项目</span>
          <button class="compact-action" id="newProject" type="button" data-i18n-title="新建项目" data-i18n-aria="新建项目">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg>
            <span class="sr-only" data-i18n="新建">新建</span>
          </button>
        </div>
        <div class="storage-notice" id="storageNotice" role="status" aria-live="polite" hidden>
          <div id="storageNoticeText"></div>
          <button class="text-button" id="retryHistory" type="button" hidden>重试加载</button>
          <button class="text-button" id="exportHistory" type="button" hidden>导出本账号记录</button>
        </div>
        <div class="storage-notice" id="legacyHistoryNotice" hidden></div>
        <input class="history-search" id="historySearch" type="search" autocomplete="off" aria-label="搜索项目或对话" data-i18n-aria="搜索项目或对话" placeholder="搜索项目或对话" data-i18n-placeholder="搜索项目或对话">
        <div id="projectList"></div>
        <p class="history-empty" id="historyEmpty" hidden data-i18n="没有找到匹配的对话">没有找到匹配的对话</p>
        <div class="empty-projects" id="projectEmpty" data-i18n="新建项目并选择本地文件夹，然后直接输入任务。">新建项目并选择本地文件夹，然后直接输入任务。</div>
      </div>
      <footer class="sidebar-foot">
        <span class="status-dot" id="runtimeDot"></span>
        <span id="runtimeStatus" data-i18n="正在检查运行时">正在检查运行时</span>
      </footer>
    </aside>
    <button class="sidebar-backdrop" id="sidebarBackdrop" type="button" tabindex="-1" aria-label="关闭项目栏" data-i18n-aria="关闭项目栏" hidden></button>

    <main class="main">
      <header class="main-head">
        <button class="text-button sidebar-toggle" id="toggleSidebar" type="button" aria-controls="workspaceSidebar" aria-expanded="true" aria-label="显示或隐藏项目栏" data-i18n-aria="显示或隐藏项目栏">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"></rect><path d="M9 3v18"></path></svg>
        </button>
        <div class="conversation-title" id="sessionHeading" data-i18n="新对话">新对话</div>
        <div class="conversation-path" id="sessionMeta"></div>
        <span class="spacer"></span>
        <details class="header-menu" id="headerMenu">
          <summary aria-label="更多操作" data-i18n-aria="更多操作">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1"></circle><circle cx="12" cy="12" r="1"></circle><circle cx="19" cy="12" r="1"></circle></svg>
          </summary>
          <div class="menu-popover">
            <button id="showActivity" type="button" data-i18n="运行详情">运行详情</button>
            <button id="showDiagnostics" type="button" data-i18n="关于与诊断">关于与诊断</button>
            <button id="renameActiveSession" type="button" data-i18n="重命名对话">重命名对话</button>
            <button class="danger" id="deleteActiveSession" type="button" data-i18n="删除对话">删除对话</button>
          </div>
        </details>
      </header>

      <section class="conversation" id="conversation">
        <div class="conversation-inner" id="conversationInner"></div>
      </section>

      <div class="composer-wrap">
        <div class="history-notice" id="historyNotice" role="status" hidden>
          <span id="historyNoticeText"></span>
          <button class="text-button" id="returnRunningSession" type="button"></button>
          <button class="text-button" id="continueViewedSession" type="button" hidden data-i18n="在此对话继续">在此对话继续</button>
        </div>
        <button class="back-to-latest" id="backToLatest" type="button" hidden data-i18n="回到最新">回到最新</button>
        <div class="composer">
          <textarea id="prompt" rows="2" aria-label="任务内容" data-i18n-aria="任务内容" placeholder="描述你想完成的任务" data-i18n-placeholder="描述你想完成的任务" disabled></textarea>
          <div class="attachment-tray" id="attachmentTray" hidden></div>
          <div class="composer-row">
            <button class="composer-button" id="addContext" type="button" data-i18n-title="添加文本文件" data-i18n-aria="添加" disabled>
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg>
              <span class="sr-only" data-i18n="添加">添加</span>
            </button>
            <input id="fileInput" type="file" multiple hidden accept=".txt,.md,.json,.jsonc,.yaml,.yml,.toml,.ini,.csv,.log,.js,.mjs,.cjs,.ts,.tsx,.jsx,.py,.rs,.go,.java,.c,.cc,.cpp,.h,.hpp,.css,.html,.xml,.sql,.sh,.ps1">

            <div class="composer-control project-control">
              <button class="composer-button project-button" id="projectButton" type="button" aria-expanded="false" aria-controls="projectPopover" data-i18n="选择项目">选择项目</button>
              <div class="control-popover" id="projectPopover" hidden>
                <div class="popover-title" data-i18n="选择项目">选择项目</div>
                <div class="popover-list" id="projectOptions"></div>
                <div class="popover-divider"></div>
                <button class="popover-option" id="createProjectFromPopover" type="button">
                  <span class="option-title" data-i18n="新建项目">新建项目</span>
                  <span class="option-copy" data-i18n="选择一个本地文件夹">选择一个本地文件夹</span>
                </button>
              </div>
            </div>

            <div class="composer-control">
              <button class="composer-button" id="permissionButton" type="button" aria-expanded="false" aria-controls="permissionPopover" disabled>
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"></path><path d="m9 12 2 2 4-4"></path></svg>
                <span id="permissionLabel">请求批准</span>
              </button>
              <div class="control-popover" id="permissionPopover" hidden>
                <div class="popover-title" data-i18n="权限">权限</div>
                <div class="popover-list">
                  <button class="popover-option" type="button" data-permission="controlled">
                    <span class="option-title"><span data-i18n="请求批准">请求批准</span><span class="check"></span></span>
                    <span class="option-copy" data-i18n="需要授权的操作会先询问你">需要授权的操作会先询问你</span>
                  </button>
                  <button class="popover-option" type="button" data-permission="readonly">
                    <span class="option-title"><span data-i18n="只读访问">只读访问</span><span class="check"></span></span>
                    <span class="option-copy" data-i18n="只允许读取和搜索项目">只允许读取和搜索项目</span>
                  </button>
                  <button class="popover-option" type="button" data-permission="full">
                    <span class="option-title"><span data-i18n="完全访问">完全访问</span><span class="check"></span></span>
                    <span class="option-copy" data-i18n="允许修改文件和执行命令">允许修改文件和执行命令</span>
                  </button>
                </div>
              </div>
            </div>

            <span class="spacer"></span>

            <div class="composer-control">
              <button class="composer-button model-effort-button" id="modelEffortButton" type="button" aria-expanded="false" aria-controls="modelEffortPopover" disabled>
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 14a1 1 0 0 1-.78-1.63l9-11a.5.5 0 0 1 .87.43l-1.7 6.8A1 1 0 0 0 12.36 10H20a1 1 0 0 1 .78 1.63l-9 11a.5.5 0 0 1-.87-.43l1.7-6.8A1 1 0 0 0 11.64 14z"></path></svg>
                <span id="modelEffortLabel">默认 · 深度</span>
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
              </button>
              <div class="control-popover align-right" id="modelEffortPopover" hidden>
                <div class="model-field">
                  <p id="modelListLabel" data-i18n="模型">模型</p>
                  <div id="modelSelect" class="model-options" role="listbox" aria-labelledby="modelListLabel" tabindex="-1"></div>
                  <p class="popover-note" id="modelAvailabilityNote"></p>
                </div>
                <fieldset class="effort-field" id="effortField" hidden>
                  <legend><span data-i18n="思考深度">思考深度</span><span class="effort-value" id="effortValue">深度</span></legend>
                  <input id="effortRange" type="range" min="0" max="0" step="1" value="0" aria-label="思考深度" data-i18n-aria="思考深度" aria-describedby="effortNote" disabled hidden>
                  <div class="effort-scale" id="effortScale" hidden><span id="effortMinimum"></span><span id="effortMaximum"></span></div>
                </fieldset>
                <p class="popover-note" id="effortNote" role="status"></p>
                <button class="card-button" id="useAvailableEffort" type="button" hidden></button>
              </div>
            </div>

            <button class="composer-button voice-button" id="voiceButton" type="button" data-i18n-title="语音输入" data-i18n-aria="语音" disabled>
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><path d="M12 19v3"></path></svg>
              <span class="sr-only" id="voiceLabel" data-i18n="语音">语音</span>
            </button>
            <button class="send-button" id="send" type="button" data-i18n-aria="发送" disabled>
              <svg class="icon send-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 7-7 7 7"></path><path d="M12 19V5"></path></svg>
              <svg class="icon stop-icon" viewBox="0 0 24 24" aria-hidden="true"><rect width="8" height="8" x="8" y="8" rx="1"></rect></svg>
              <span class="sr-only" id="sendLabel" data-i18n="发送">发送</span>
            </button>
          </div>
        </div>
      </div>

      <aside class="activity" id="activityPanel" hidden>
        <div class="activity-head">
          <strong id="activityTitle">本次任务详情</strong>
          <small id="eventCount">0 条</small>
          <button class="text-button" id="closeActivity" type="button" data-i18n="关闭">关闭</button>
        </div>
        <div class="activity-body">
          <select id="activityScope" class="activity-scope" aria-label="选择任务记录"></select>
          <div class="activity-empty" id="eventEmpty" data-i18n="CCB 的读取、分析、工具调用和完成状态会显示在这里。">CCB 的读取、分析、工具调用和完成状态会显示在这里。</div>
          <div id="eventLog"></div>
        </div>
      </aside>
    </main>
  </div>

  <div class="modal-backdrop" id="diagnosticsModal" role="dialog" aria-modal="true" aria-labelledby="diagnosticsTitle">
    <section class="modal">
      <header>
        <h2 id="diagnosticsTitle" data-i18n="关于与诊断">关于与诊断</h2>

  <script>
    // BEGIN CLARITIDE_ACCOUNT_HISTORY_STORE
    // The native runtime supplies a verified account scope. Database names never
    // contain credentials. Unknown legacy localStorage data is not imported.
    function createAccountHistoryStore(indexedDB, scope) {
      'use strict';
      if (!/^[A-Za-z0-9_-]{1,128}$/.test(scope || '')) return Promise.reject(new Error('HISTORY_ACCOUNT_REQUIRED'));
      if (!indexedDB) return Promise.reject(new Error('HISTORY_STORAGE_UNAVAILABLE'));
      return new Promise(function (resolve, reject) {
        var settled = false;
        var request;
        var timer = setTimeout(function () { fail(new Error('HISTORY_OPEN_TIMEOUT')); }, 5000);
        function fail(error) { if (!settled) { settled = true; clearTimeout(timer); reject(error); } }
        try { request = indexedDB.open('claritide.agent.account.v1.' + scope, 1); }
        catch (error) { fail(error); return; }
        request.onerror = function () { fail(request.error || new Error('HISTORY_OPEN_FAILED')); };
        request.onblocked = function () { fail(new Error('HISTORY_STORAGE_BLOCKED')); };
        request.onupgradeneeded = function () {
          if (settled) { request.transaction.abort(); return; }
          var db = request.result;
          ['projects', 'sessions', 'meta'].forEach(function (name) {
            if (!db.objectStoreNames.contains(name)) db.createObjectStore(name, { keyPath: 'key' });
          });
        };
        request.onsuccess = function () {
          var db = request.result;
          if (settled) { db.close(); return; }
          settled = true; clearTimeout(timer);
          var closed = false;
          var loaded = false;
          var transactions = new Set();
          var queue = Promise.resolve();
          var committed = { projects: new Map(), sessions: new Map(), meta: new Map() };
          function assertOpen() { if (closed) throw new Error('HISTORY_ACCOUNT_CHANGED'); }
          function transaction(mode, work) {
            return new Promise(function (done, failed) {
              var tx;
              try { assertOpen(); tx = db.transaction(['projects', 'sessions', 'meta'], mode); }
              catch (error) { failed(error); return; }
              transactions.add(tx);
              tx.oncomplete = function () { transactions.delete(tx); done(); };
              tx.onabort = tx.onerror = function () { transactions.delete(tx); failed(tx.error || new Error('HISTORY_TRANSACTION_FAILED')); };
              try { work(tx); } catch (error) { try { tx.abort(); } catch (_) {} failed(error); }
            });
          }
          function rowsFor(projects, composer) {
            var rows = { projects: new Map(), sessions: new Map(), meta: new Map() };
            projects.forEach(function (project) {
              var meta = { id: project.id, name: project.name, path: project.path, updatedAt: project.updatedAt || 0 };
              rows.projects.set(project.id, JSON.stringify(meta));
              (project.sessions || []).forEach(function (session) {
                var value = Object.assign({}, session);
                // Streaming fragments and native capabilities are transient.
                Object.keys(value).forEach(function (key) { if (key.charAt(0) === '_') delete value[key]; });
                rows.sessions.set(JSON.stringify([project.id, session.id]), JSON.stringify({ projectId: project.id, session: value }));
              });
            });
            rows.meta.set('composer', JSON.stringify(composer));
            return rows;
          }
          var api = {
            load: async function () {
              assertOpen();
              var raw = {};
              await transaction('readonly', function (tx) {
                ['projects', 'sessions', 'meta'].forEach(function (name) {
                  var read = tx.objectStore(name).getAll();
                  read.onsuccess = function () { raw[name] = read.result; };
                });
              });
              assertOpen();
              var projects = [];
              var byId = new Map();
              var next = { projects: new Map(), sessions: new Map(), meta: new Map() };
              var composer = null;
              ['projects', 'sessions', 'meta'].forEach(function (name) {
                (raw[name] || []).forEach(function (row) {
                  if (!row || typeof row.key !== 'string' || typeof row.json !== 'string') throw new Error('HISTORY_RECORD_INVALID');
                  next[name].set(row.key, row.json);
                });
              });
              next.projects.forEach(function (json, key) {
                var project = JSON.parse(json);
                if (!project || typeof project.id !== 'string' || project.id !== key || typeof project.name !== 'string' || typeof project.path !== 'string') throw new Error('HISTORY_PROJECT_INVALID');
                project.sessions = [];
                projects.push(project); byId.set(project.id, project);
              });
              next.sessions.forEach(function (json, key) {
                var value = JSON.parse(json);
                var project = value && byId.get(value.projectId);
                if (!project || !value.session || typeof value.session.id !== 'string' || key !== JSON.stringify([project.id, value.session.id]) || !Array.isArray(value.session.messages)) throw new Error('HISTORY_SESSION_INVALID');
                project.sessions.push(value.session);
              });
              if (next.meta.has('composer')) composer = JSON.parse(next.meta.get('composer'));
              committed = next; loaded = true;
              return { projects: projects, composer: composer };
            },
            save: function (projects, composer) {
              var rows;
              try { assertOpen(); if (!loaded) throw new Error('HISTORY_NOT_LOADED'); rows = rowsFor(projects, composer); }
              catch (error) { return Promise.reject(error); }
              // Snapshots are captured before queueing; a later account change
              // cannot make a queued write read the new account's state.
              var operation = queue.catch(function () {}).then(async function () {
                assertOpen();
                var changed = ['projects', 'sessions', 'meta'].some(function (name) {
                  return rows[name].size !== committed[name].size || Array.from(rows[name]).some(function (entry) { return committed[name].get(entry[0]) !== entry[1]; });
                });
                if (!changed) return;
                await transaction('readwrite', function (tx) {
                  ['projects', 'sessions', 'meta'].forEach(function (name) {
                    var store = tx.objectStore(name);
                    committed[name].forEach(function (_, key) { if (!rows[name].has(key)) store.delete(key); });
                    rows[name].forEach(function (json, key) { if (committed[name].get(key) !== json) store.put({ key: key, json: json }); });
                  });
                });
                assertOpen();
                committed = rows;
              });
              queue = operation;
              return operation;
            },
            close: function () {
              closed = true;
              transactions.forEach(function (tx) { try { tx.abort(); } catch (_) {} });
              transactions.clear(); db.close();
            }
          };
          db.onversionchange = function () { api.close(); };
          resolve(api);
        };
      });
    }
    // END CLARITIDE_ACCOUNT_HISTORY_STORE

    // BEGIN CLARITIDE_TASK_RUNS
    // Store only bounded, structured tool evidence. A completed Agent turn is
    // never evidence that a command, a test, or the user's goal succeeded.
    var ClaritideTaskRuns = (function () {
      'use strict';
      function text(value, limit) { return typeof value === 'string' ? value.slice(0, limit) : ''; }
      function toolId(value) { return typeof value === 'string' && /^[!-~]{1,256}$/.test(value) ? value : ''; }
      function outcome(value) { return ['succeeded', 'failed', 'unknown'].indexOf(value) >= 0 ? value : 'unknown'; }
      function plan(value) {
        if (!value || !Array.isArray(value.items)) return null;
        return { items: value.items.slice(0, 60).filter(function (item) { return item && typeof item.content === 'string'; }).map(function (item) {
          return { content: text(item.content, 500), activeForm: text(item.activeForm, 500), status: ['pending', 'in_progress', 'completed'].indexOf(item.status) >= 0 ? item.status : 'pending' };
        }), truncated: Boolean(value.truncated || value.items.length > 60) };
      }
      function evidence(value) {
        if (!value || ['file', 'command'].indexOf(value.kind) < 0) return null;
        return { kind: value.kind, path: text(value.path, 2000), command: text(value.command, 2000), status: outcome(value.status), exitCode: Number.isInteger(value.exitCode) ? value.exitCode : null, truncated: Boolean(value.truncated || typeof value.path === 'string' && value.path.length > 2000 || typeof value.command === 'string' && value.command.length > 2000) };
      }
      function operation(value) {
        if (!value || !toolId(value.id)) return null;
        var proof = evidence(value.evidence);
        var status = ['running', 'succeeded', 'failed', 'unknown'].indexOf(value.status) >= 0 ? value.status : 'unknown';
        if (proof && proof.kind === 'command' && proof.status !== 'succeeded') status = proof.status;
        return { id: toolId(value.id), tool: text(value.tool, 100), detail: text(value.detail, 2000), status: status, preview: text(value.preview, 2000), truncated: Boolean(value.truncated), evidence: proof };
      }
      function restore(values) {
        if (!Array.isArray(values)) return [];
        return values.slice(-12).filter(function (run) { return run && typeof run.id === 'string'; }).map(function (run) {
          return { id: text(run.id, 200), goal: text(run.goal, 2000), startedAt: Number(run.startedAt) || 0, endedAt: Number(run.endedAt) || 0,
            status: ['finished', 'failed', 'stopped', 'interrupted'].indexOf(run.status) >= 0 ? run.status : 'interrupted',
            plan: plan(run.plan), operations: (Array.isArray(run.operations) ? run.operations : []).slice(-80).map(operation).filter(Boolean).map(function (item) { if (item.status === 'running') item.status = 'unknown'; return item; }),
            truncated: Boolean(run.truncated || (Array.isArray(run.operations) && run.operations.length > 80)) };
        });
      }
      function start(session, id, goal, time) {
        if (!Array.isArray(session.taskRuns)) session.taskRuns = [];
        var run = { id: id, goal: text(goal, 2000), startedAt: time, endedAt: 0, status: 'running', plan: null, operations: [], truncated: false };
        session.taskRuns.push(run);
        if (session.taskRuns.length > 12) session.taskRunsTruncated = true;
        session.taskRuns = session.taskRuns.slice(-12);
        return run;
      }
      function update(session, type, payload, time) {
        var run = session.taskRuns && session.taskRuns[session.taskRuns.length - 1];
        if (!run || run.status !== 'running') return false;
        payload = payload || {};
        if (type === 'tool_started' || type === 'tool_completed') {
          var id = toolId(payload.toolUseId);
          if (!id) return false;
          var item = run.operations.find(function (entry) { return entry.id === id; });
          if (type === 'tool_started') {
            if (!item) {
              if (run.operations.length >= 80) { run.operations.shift(); run.truncated = true; }
              item = { id: id, tool: '', detail: '', status: 'running', preview: '', truncated: false, evidence: null };
              run.operations.push(item);
            }
            item.tool = text(payload.tool || payload.toolName, 100) || item.tool;
            var input = payload.input || {};
            var detail = input.file_path || input.notebook_path || input.command;
            item.detail = text(detail, 2000) || item.detail;
            item.truncated = item.truncated || Boolean(input.truncated || typeof detail === 'string' && detail.length > 2000);
          } else {
            if (!item || item.status !== 'running') return false;
            item.status = payload.isError === true ? 'failed' : outcome(payload.outcome);
            item.tool = text(payload.tool, 100) || item.tool;
            item.preview = text(payload.preview, 2000);
            item.truncated = item.truncated || Boolean(payload.previewTruncated || typeof payload.preview === 'string' && payload.preview.length > 2000);
            item.evidence = evidence(payload.evidence);
            if (item.evidence && item.evidence.kind === 'command' && item.status !== 'failed' && item.evidence.status !== 'succeeded') item.status = item.evidence.status;
            if (item.evidence && item.status !== 'succeeded') item.evidence.status = item.status;
            if (item.status === 'succeeded' && payload.plan) run.plan = plan(payload.plan);
          }
        } else if (type === 'turn_completed' || (type === 'error' && payload.terminal === true) || (type === 'stopped' && !payload.settling)) {
          run.status = type === 'turn_completed' ? 'finished' : type === 'error' ? 'failed' : 'stopped';
          run.endedAt = time;
          run.operations.forEach(function (item) { if (item.status === 'running') item.status = 'unknown'; });
        } else return false;
        return true;
      }
      return { start: start, update: update, restore: restore };
    })();

      function loadComposerState(saved) {

            var owner;
            try { owner = JSON.parse(key); } catch (_error) { return; }
            var project = Array.isArray(owner) && state.projects.find(function (item) { return item.id === owner[0]; });
            var draft = saved.drafts[key];

      async function copyOutputText(text, button) {
        var previous = document.activeElement;
        var temporary;

          if (window.navigator && window.navigator.clipboard && window.navigator.clipboard.writeText) {
            await window.navigator.clipboard.writeText(safeText(text));

            temporary = document.createElement('textarea');
            temporary.value = safeText(text);
            temporary.setAttribute('aria-label', english ? 'Text to copy' : '待复制文本');
            temporary.style.cssText = 'position:fixed;left:-9999px;top:0';
            document.body.appendChild(temporary);
            temporary.select();
            if (!document.execCommand || !document.execCommand('copy')) throw new Error('clipboard_unavailable');
          }
          showToast(english ? 'Copied' : '已复制');
          return true;
        } catch (error) {
          showToast(english ? 'Could not copy. Select the text and copy it manually.' : '复制失败，请选中文本后手动复制。');
          return false;
        } finally {
          if (temporary) temporary.remove();
          if (previous && previous.focus) previous.focus();
          else if (button && button.focus) button.focus();

      }

      function markdownTarget(target) {
        // The trusted local document has no external/file opener capability.
        // Links explicitly copy a destination; they never navigate this window.
        if (/^https?:\/\//i.test(target) && !/[\u0000-\u0020\u007f]/.test(target)) return 'url';
        if (/^[a-z][a-z0-9+.-]*:/i.test(target) && !/^[a-z]:[\\/]/i.test(target)) return '';
        if (/^[\\/]|^\.{1,2}[\\/]|^[a-z]:[\\/]/i.test(target) || /^[\w.@-]+(?:[\\/][\w.@ -]+)+$/.test(target) || /^[\w.@ -]+\.[a-z0-9]{1,12}(?:#[\w-]+)?$/i.test(target)) return 'path';
        return '';
      }

      function appendInlineMarkdown(host, text, depth) {
        if ((depth || 0) > 3) { host.appendChild(document.createTextNode(text)); return; }
        var pattern = /`([^`\n]+)`|\[([^\]\n]{1,240})\]\(([^\s\n]{1,2048})\)|\*\*([^*\n]+)\*\*|\*([^*\n]+)\*/g;
        var match, position = 0;
        while ((match = pattern.exec(text))) {
          host.appendChild(document.createTextNode(text.slice(position, match.index)));
          if (match[1] !== undefined) {
            var code = document.createElement('code'); code.textContent = match[1]; host.appendChild(code);
          } else if (match[2] !== undefined) {
            var kind = markdownTarget(match[3]);
            if (kind) {
              var link = outputCopyButton(match[2], match[3]);
              link.className = 'markdown-link';
              link.title = match[3];
              var action = kind === 'url' ? (english ? 'copy URL' : '复制链接') : (english ? 'copy path' : '复制路径');
              link.setAttribute('aria-label', match[2] + ' · ' + action + ' · ' + match[3]);
              var hint = document.createElement('small'); hint.textContent = action; link.appendChild(hint);
              host.appendChild(link);
            } else host.appendChild(document.createTextNode(match[0]));
          } else {
            var emphasis = document.createElement(match[4] !== undefined ? 'strong' : 'em');
            appendInlineMarkdown(emphasis, match[4] || match[5], (depth || 0) + 1);
            host.appendChild(emphasis);
          }
          position = pattern.lastIndex;
        }
        host.appendChild(document.createTextNode(text.slice(position)));
      }

      function markdownTableCells(line) {
        var source = line.trim().replace(/^\||\|$/g, '');
        var cells = [], cell = '';
        for (var index = 0; index < source.length; index += 1) {
          if (source[index] === '\\' && source[index + 1] === '|') { cell += '|'; index += 1; }
          else if (source[index] === '|') { cells.push(cell.trim()); cell = ''; }
          else cell += source[index];
        }
        cells.push(cell.trim());
        return cells;
      }

      function renderAnswer(body, text) {
        var source = safeText(text);
        body._markdownSource = source;
        body._streaming = false;
        body.textContent = '';
        body.classList.add('formatted');
        // A corrupt/imported oversized response remains selectable plain text.
        if (source.length > 262144) { body.classList.remove('formatted'); body.textContent = source; return; }
        var lines = source.replace(/\r\n?/g, '\n').split('\n');
        var index = 0;
        while (index < lines.length) {
          var line = lines[index];
          if (!line.trim()) { index += 1; continue; }
          var fence = /^\s{0,3}(`{3,}|~{3,})([^`]*)$/.exec(line);
          if (fence) {
            var codeLines = [], marker = fence[1][0], length = fence[1].length;
            index += 1;
            while (index < lines.length && !new RegExp('^\\s{0,3}' + marker + '{' + length + ',}\\s*$').test(lines[index])) { codeLines.push(lines[index]); index += 1; }
            if (index < lines.length) index += 1;
            var block = document.createElement('div'); block.className = 'markdown-code';
            var bar = document.createElement('div'); bar.className = 'markdown-code-bar';
            var language = document.createElement('span'); language.textContent = fence[2].trim() || (english ? 'Code' : '代码');
            var codeText = codeLines.join('\n');
            bar.appendChild(language); bar.appendChild(outputCopyButton(english ? 'Copy code' : '复制代码', codeText));
            var pre = document.createElement('pre'); var code = document.createElement('code'); code.textContent = codeText;
            pre.appendChild(code); block.appendChild(bar); block.appendChild(pre); body.appendChild(block);
            continue;
          }
          if (index + 1 < lines.length && line.indexOf('|') !== -1) {
            var headings = markdownTableCells(line), divider = markdownTableCells(lines[index + 1]);
            if (headings.length > 1 && headings.length <= 16 && divider.length === headings.length && divider.every(function (cell) { return /^:?-{3,}:?$/.test(cell); })) {
              var wrapper = document.createElement('div'); wrapper.className = 'markdown-table-wrap';
              var table = document.createElement('table'), thead = document.createElement('thead'), headerRow = document.createElement('tr');
              headings.forEach(function (cell) { var th = document.createElement('th'); th.setAttribute('scope', 'col'); appendInlineMarkdown(th, cell); headerRow.appendChild(th); });
              thead.appendChild(headerRow); table.appendChild(thead);
              var tbody = document.createElement('tbody'); index += 2;
              while (index < lines.length && lines[index].trim() && lines[index].indexOf('|') !== -1) {
                var cells = markdownTableCells(lines[index]);
                if (cells.length !== headings.length) break;
                var row = document.createElement('tr');
                cells.forEach(function (cell) { var td = document.createElement('td'); appendInlineMarkdown(td, cell); row.appendChild(td); });
                tbody.appendChild(row); index += 1;
              }
              table.appendChild(tbody); wrapper.appendChild(table); body.appendChild(wrapper); continue;
            }
          }
          var heading = /^(#{1,6})\s+(.+)$/.exec(line);
          if (heading) {
            var title = document.createElement('h' + Math.min(3, heading[1].length)); appendInlineMarkdown(title, heading[2]); body.appendChild(title); index += 1; continue;
          }
          var list = /^\s*(?:([-+*])|(\d+)\.)\s+(.+)$/.exec(line);
          if (list) {
            var ordered = Boolean(list[2]), listNode = document.createElement(ordered ? 'ol' : 'ul');
            if (ordered && Number(list[2]) > 1) listNode.setAttribute('start', String(Number(list[2])));
            do {
              var item = document.createElement('li'); appendInlineMarkdown(item, list[3]); listNode.appendChild(item); index += 1;
              list = index < lines.length ? /^\s*(?:([-+*])|(\d+)\.)\s+(.+)$/.exec(lines[index]) : null;
            } while (list && Boolean(list[2]) === ordered);
            body.appendChild(listNode); continue;
          }
          var quoted = /^>\s?(.*)$/.exec(line);
          if (quoted) {
            var quote = document.createElement('blockquote'); var quotedLines = [];
            do { quotedLines.push(quoted[1]); index += 1; quoted = index < lines.length ? /^>\s?(.*)$/.exec(lines[index]) : null; } while (quoted);
            appendInlineMarkdown(quote, quotedLines.join('\n')); body.appendChild(quote); continue;
          }
          var paragraph = document.createElement('p'); var paragraphLines = [line]; index += 1;
          while (index < lines.length && lines[index].trim() && !/^\s*(?:#{1,6}\s|`{3,}|~{3,}|>|[-+*]\s|\d+\.\s)/.test(lines[index])) {
            if (index + 1 < lines.length && lines[index].indexOf('|') !== -1 && markdownTableCells(lines[index + 1]).every(function (cell) { return /^:?-{3,}:?$/.test(cell); })) break;
            paragraphLines.push(lines[index]); index += 1;
          }
          appendInlineMarkdown(paragraph, paragraphLines.join('\n')); body.appendChild(paragraph);
        }
      }

      function errorSummary(code, message) {
        if (code === 'session_mismatch' || /event for a different session/i.test(message)) return english

      function renderEffortControls(projectReady, runtimeReady, locked, busy) {

        else if (unavailable) notes.push(effortUnavailableMessage());
        else if (levels.length === 1) notes.push(english ? 'The service currently offers only this fixed level.' : '当前服务仅开放这一档，无需拖动。');

        if (locked && unavailable && recoverable) notes.push(english ? 'Confirm an available level below to reconnect this chat. Its history and your draft will be retained.' : '确认下方可用档位后将重新连接此对话，保留历史和草稿。');
        else if (locked || busy) notes.push(english ? 'This chat’s settings are locked. Start a new chat to change the model or thinking depth.' : '本对话设置已锁定，请新建对话调整模型或思考深度。');

      function permissionLabel(value) {

      function unavailableSelectedModel() {
        var current = currentModel();

      async function chooseRecoveryModel(sessionId) {
        var session = activeSession();
        var ownerEpoch = state.storageEpoch;
        if (!session || session.id !== sessionId || recoveryInteractionBlocked()) return;
        try {
          // Model changes require an idle native session to be closed first.
          // Keep its history ID so the next send can resume the same chat.
          if (state.nativeSessionId || state.closingSessionId) await closeNativeSession();
          if (ownerEpoch !== state.storageEpoch || session !== activeSession() || recoveryInteractionBlocked()) return;
          fillModels(state.status && state.status.allowedModels || []);
          syncControls();
          $('#modelEffortPopover').hidden = false;
          $('#modelEffortButton').setAttribute('aria-expanded', 'true');
          focusModelOption();
        } catch (error) {
          if (ownerEpoch === state.storageEpoch && session === activeSession()) showToast(safeText(error && error.message || error));
        }
      }

      function fillModels(models) {
        var select = $('#modelSelect');
        var current = currentModel() || 'default';
        models = Array.isArray(models) ? models.filter(function (model, index, all) { return typeof model === 'string' && model && all.indexOf(model) === index; }) : [];
        var available = Boolean(state.status && state.status.available && models.length);
        var values = models.slice();
        var locked = Boolean(state.nativeSessionId || state.turnActive || state.starting || state.pendingSend || browsingHistory() || state.switchingConversation || !state.storageReady);
        var ownerEpoch = state.storageEpoch, ownerSessionId = state.activeSessionId, ownerProjectId = state.activeProjectId;
        var key = JSON.stringify([values, current, available, locked, ownerEpoch, ownerProjectId, ownerSessionId, state.status && state.status.defaultModel]);
        if (select._optionsKey === key) return;
        select._optionsKey = key;
        var focusedValue = document.activeElement && document.activeElement.className === 'model-option' ? document.activeElement.value : null;
        // Refreshing an expired authorization must never rewrite a saved choice.
        // "default" remains a choice; native startup resolves it on an actual send.
        if (values.indexOf(current) < 0) values.unshift(current);
        select.textContent = '';
        values.forEach(function (model) {
          var option = document.createElement('button');
          option.type = 'button'; option.className = 'model-option';
          option.value = model;
          var missing = available && model === current && model !== 'default' && models.indexOf(model) < 0;
          option.disabled = missing || !available || locked;
          option.setAttribute('role', 'option');
          option.setAttribute('aria-selected', String(model === current));
          option.setAttribute('aria-disabled', String(option.disabled));
          option.tabIndex = !option.disabled && (model === current || unavailableSelectedModel() && model === models[0]) ? 0 : -1;
          option.textContent = modelLabel(model) + (missing ? (english ? ' — unavailable, choose another' : ' — 不可用，请重新选择') : '');
          if (model === 'default' && available && state.status.defaultModel) option.textContent += ' · ' + modelLabel(state.status.defaultModel);
          option.addEventListener('click', function () {
            if (ownerEpoch !== state.storageEpoch || ownerProjectId !== state.activeProjectId || ownerSessionId !== state.activeSessionId || option.disabled) return;
            setModel(model);
            focusModelOption();
          });
          select.appendChild(option);
          if (focusedValue === model && !option.disabled) option.focus();
        });
        select.value = current;
        select.title = unavailableSelectedModel() ? (english ? 'Your previous model is no longer available. Choose a model to continue; your draft is saved.' : '原模型已不可用，请选择模型继续；草稿已保留。') : '';
        var note = $('#modelAvailabilityNote');
        note.textContent = !available ? (english ? 'Sign in to load available models. Your choice is kept.' : '登录后加载可用模型，原选择已保留。') : models.length === 1 ? (english ? 'Your account currently has one available model.' : '当前账号仅授权了这一个模型。') : (english ? models.length + ' models available for your account.' : '当前账号可用 ' + models.length + ' 个模型。');
        if (state.nativeSessionId || state.turnActive || state.starting || state.pendingSend) note.textContent += english ? ' Start a new chat to change these settings.' : ' 请新建对话调整这些设置。';
      }

      function focusModelOption() {
        var items = $$('#modelSelect .model-option').filter(function (node) { return !node.disabled; });

      function onModelKeydown(event) {
        if (event.key === 'Escape') {
          event.preventDefault(); event.stopPropagation(); closeControlPopovers(); $('#modelEffortButton').focus(); return;
        }
        if (['ArrowDown', 'ArrowUp', 'Home', 'End'].indexOf(event.key) < 0) return;
        var items = $$('#modelSelect .model-option').filter(function (node) { return !node.disabled; });
        if (!items.length) return;
        event.preventDefault();
        var current = items.indexOf(document.activeElement);
        var next = event.key === 'Home' ? 0 : event.key === 'End' ? items.length - 1 : (current + (event.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length;
        items.forEach(function (node, index) { node.tabIndex = index === next ? 0 : -1; });
        items[next].focus();
      }

      function renderAttachments() {

      function syncControls() {
        var project = activeProject();
        var session = activeSession();
        var readOnly = browsingHistory() || state.switchingConversation;
        var projectReady = Boolean(project && state.storageReady && !readOnly);
        var runtimeReady = Boolean(state.status && state.status.available);

        var promptHasValue = Boolean($('#prompt').value.trim() || state.attachments.length);

        $('#prompt').disabled = !projectReady || !runtimeReady;
        $('#addContext').disabled = !projectReady || !runtimeReady || busy;
        $('#permissionButton').disabled = !projectReady || locked || busy;

        $('#permissionLabel').textContent = permissionLabel(currentPermission());
        $('#modelEffortLabel').textContent = modelLabel(currentModel()) + (effortSupported ? ' · ' + effortLabel(currentEffort()) + (unavailableSelectedEffort() ? (english ? ' (unavailable)' : '（不可用）') : '') : '');
        fillModels(state.status && state.status.allowedModels || []);
        $('#voiceLabel').textContent = tr(state.voiceActive ? '正在聆听' : '语音');
        $('#voiceButton').setAttribute('aria-label', tr(state.voiceActive ? '正在聆听' : '语音'));

        $$('.project-row, .session-row').forEach(function (button) { button.disabled = state.starting || state.pendingSend || state.switchingConversation; });
        $$('.item-menu button').forEach(function (button) { button.disabled = readOnly || busy || !state.storageReady; });
        $$('#attachmentTray button').forEach(function (button) { button.disabled = readOnly || !state.storageReady; });
        renderHistoryNotice();
      }

      async function closeNativeSession(clearOnline) {
        var epoch = state.storageEpoch;
        var id = state.nativeSessionId || state.closingSessionId;
        state.closingSessionId = id;
        state.nativeSessionId = '';
        state.turnActive = false;
        state.starting = false;
        state.pendingApprovals = {};
        var previous = state.closingPromise;
        var operation = (async function () {
          await previous;
          if (epoch !== state.storageEpoch) return;
          if (bridge && (id || clearOnline)) {
            await bridge.close({
              sessionId: id || null,
              clearOnline: clearOnline === true
            });
            if (epoch !== state.storageEpoch) return;
            if (id) {
              for (var attempt = 0; attempt < 45; attempt += 1) {
                var sessions = await bridge.listSessions();
                if (epoch !== state.storageEpoch) return;
                var pending = sessions.find(function (item) { return item.sessionId === id && (item.reaped === false || item.phase === 'running' || item.phase === 'closing'); });
                if (!pending) { if (state.closingSessionId === id) state.closingSessionId = ''; return; }
                await new Promise(function (resolve) { window.setTimeout(resolve, 100); });
              }
              throw new Error(english ? 'The previous task is still closing. Please retry.' : '上一个任务仍在关闭，请稍后重试。');
            }
          }
        })();
        // Keep the queue recoverable, but propagate this operation's failure to
        // callers. A later send retries cleanup before starting another child.
        state.closingPromise = operation.catch(function (error) { if (epoch === state.storageEpoch) showToast(safeText(error && error.message || error)); });
        return operation;
      }

      function selectProject(projectId) {
        if (state.starting || state.pendingSend || state.switchingConversation) return showToast(english ? 'Wait for the message to be accepted.' : '正在发送，请稍等。');

      async function deleteProject(projectId) {
        if (!state.storageReady || browsingHistory() || state.turnActive || state.starting || state.pendingSend) return;
        var epoch = state.storageEpoch;
